services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: youpi-pg:latest
    container_name: youpi-pg
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      YOUPI_MODE: ${YOUPI_MODE:-localhost}
      # The container ships without a Cloudflare domain, so localhost mode is requested
      # explicitly rather than being an implicit fallback. scripts/start.js still refuses to
      # run in production mode without a domain.
      YOUPI_ALLOW_LOCALHOST_MODE: ${YOUPI_ALLOW_LOCALHOST_MODE:-true}
      YOUPI_BIND_HOST: "0.0.0.0"
      BASE_PAYMENT_API_URL: http://localhost:6100
      BASE_CHECKOUT_URL: http://localhost:7000
      BASE_ADMIN_URL: http://localhost:6001
      USE_SQLITE_FALLBACK: "true"
      SQLITE_DB_PATH: /app/data/youpi_pg.sqlite
      PAYMENT_API_PORT: 6100
      CHECKOUT_PORTAL_PORT: 7000
      MERCHANT_ADMIN_PORT: 6001
      GMAIL_OBSERVER_PORT: 6003
      SMS_OBSERVER_PORT: 6002
      COIN_WALLET_STORE_PORT: 5000
      CONTROL_CENTER_PORT: 8090
    ports:
      - "6100:6100"   # Payment Core REST API
      - "7000:7000"   # Checkout Portal
      - "5000:5000"   # Coin Wallet Demo Store
      - "127.0.0.1:6001:6001"   # Merchant Admin Dashboard
      - "127.0.0.1:6002:6002"   # Android SMS Observer
      - "127.0.0.1:6003:6003"   # Gmail Observer
      - "127.0.0.1:8090:8090"   # Process Supervisor Daemon
    volumes:
      - youpi-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  youpi-data:
    driver: local
